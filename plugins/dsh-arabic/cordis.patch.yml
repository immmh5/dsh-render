# dsh-arabic — bundle patch layer.
#
# Mounts the plugin row at DSH boot via `dsh.bundle.patch`. When installed
# through the official CLI (or as a profile dependency) the profile boot
# merges this patch and mounts the host half (`lib/index.js`); the
# `dsh.client` declaration + `exports["./client"]` register the browser half,
# which calls `ctx.locale.addLanguage({ id: 'ar', … })` and
# `ctx.locale.register(ns, 'ar', …)` for every shipped namespace.
- insert:
    - id: dsh-arabic
      name: 'dsh-arabic'
