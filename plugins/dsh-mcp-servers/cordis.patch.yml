# Mounts the plugin row at DSH boot via `dsh.bundle.patch`. When installed
# through the official CLI (or as a profile dependency) the profile boot
# merges this patch and mounts the host half (`lib/host.js`); the
# `dsh.client` declaration + `exports["./client"]` register the browser half,
# which owns the "خوادم MCP" settings section.
- insert:
    - id: mcp-servers
      name: 'dsh-mcp-servers'
