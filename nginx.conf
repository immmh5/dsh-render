# Local reverse proxy: Render's proxy reaches us on 0.0.0.0:$PORT; dsh's web UI
# refuses to bind anything but 127.0.0.1 (it guards against exposing RCE to the
# network). nginx bridges the two: it listens on all interfaces and forwards to
# dsh on loopback. WebSocket/SSE upgrade is preserved for streaming responses.
worker_processes 1;

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  access_log off;
  client_max_body_size 100m;
  # Long-running agent turns and streaming responses: don't time out mid-thought.
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_connect_timeout 60s;
  # Buffers for large SSE frames (tool results, file listings).
  proxy_buffering off;
  proxy_cache off;
  chunked_transfer_encoding on;

  # Trust Render's proxy so the app sees the real client scheme.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from fd00::/8;
  real_ip_header X-Forwarded-For;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 0.0.0.0:__NGINX_PORT__;
    server_name _;

    location / {
      proxy_pass http://127.0.0.1:__DSH_PORT__;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
