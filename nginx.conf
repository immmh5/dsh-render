# Local reverse proxy: Render's proxy reaches us on 0.0.0.0:$PORT; dsh's web UI
# refuses to bind anything but 127.0.0.1 (it guards against exposing RCE to the
# network). nginx bridges the two: it listens on all interfaces and forwards to
# dsh on loopback. WebSocket/SSE upgrade is preserved for streaming responses.
worker_processes 1;

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  access_log off;
  client_max_body_size 100m;
  # Long-running agent turns and streaming responses: don't time out mid-thought.
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_connect_timeout 60s;
  # Buffers for large SSE frames (tool results, file listings).
  proxy_buffering off;
  proxy_cache off;
  chunked_transfer_encoding on;

  # Trust Render's proxy so the app sees the real client scheme.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from fd00::/8;
  real_ip_header X-Forwarded-For;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 0.0.0.0:__NGINX_PORT__;
    server_name _;

    # Served by nginx itself, not proxied: Render's health check needs a 200
    # while dsh is still booting its plugin tree (~25s on a fresh install).
    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # The login gate: nginx serves the static login page itself. Its form GETs
    # /?token=<code>, which dsh's authorizeIndex exchanges for the session
    # cookie natively — no custom auth code anywhere.
    location = /login {
      access_log off;
      root /app/login;
      try_files /index.html =404;
      default_type text/html;
    }

    # The index only. dsh answers 401 here when there is no valid session
    # cookie, and we swap that for the login page. Scoped to the exact root so
    # API/SSE 401s elsewhere keep their real status for the frontend to handle.
    location = / {
      proxy_pass http://127.0.0.1:__DSH_PORT__;
      proxy_intercept_errors on;
      error_page 401 = /login;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: SPA assets, the API/RPC endpoints, WebSocket and SSE
    # streams. Public assets are served by dsh without auth; API calls carry
    # the session cookie or the trust fence rejects them.
    location / {
      proxy_pass http://127.0.0.1:__DSH_PORT__;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
